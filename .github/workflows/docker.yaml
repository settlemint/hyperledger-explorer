name: docker
on:
  push:
    branches:
      - main

env:
  XDG_CACHE_HOME: ${{ github.workspace }}/.cache

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: docker
    runs-on: namespace-profile-hyperledger-explorer
    steps:
      - name: Checkout
        uses: namespacelabs/nscloud-checkout-action@63f88aa089f855c0d888a2b1baffcbc44cc7262e # v6
      - name: Login to GitHub Container Registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Inject slug/short variables
        uses: rlespinasse/github-slug-action@v3.x
      - name: Build and Push
        uses: docker/build-push-action@ca877d9245402d1537745e0e356eab47c3520991 # v6
        with:
          context: .
          file: ./Dockerfile
          pull: true
          push: true
          # platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/settlemint/hyperledger-explorer:${{ env.GITHUB_REF_SLUG }}
            ghcr.io/settlemint/hyperledger-explorer:${{ env.GITHUB_REF_SLUG }}-${{ github.run_number }}
            ghcr.io/settlemint/hyperledger-explorer:latest
